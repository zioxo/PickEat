        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                if (type === 'tick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320 + Math.random() * 80, ctx.currentTime);
                    gain.gain.setValueAtTime(0.03, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.035);
                } else if (type === 'win') {
                    const notes = [261.63, 329.63, 392.00, 523.25];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
                        gain.gain.setValueAtTime(0.06, ctx.currentTime + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.28);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.07);
                        osc.stop(ctx.currentTime + idx * 0.07 + 0.28);
                    });
                }
            } catch (e) {
                // Audio context muted before user interaction
            }
        };

        const { useState, useEffect, useRef, useMemo } = React;

        function App() {
            const [dishes, setDishes] = useState(() => {

        function HoyTab({ dishes, family, history, setHistory, antiRepeatDays, todayChoice, setTodayChoice, showToast, onAddDishClick }) {
            const [isSpinning, setIsSpinning] = useState(false);
            const [rouletteIndex, setRouletteIndex] = useState(0);
            const [checkedIngredients, setCheckedIngredients] = useState({});

            const eligibleDishes = useMemo(() => {
                if (dishes.length <= 1) return dishes;

                const cutoffDate = new Date();
                cutoffDate.setDate(cutoffDate.getDate() - antiRepeatDays);
                cutoffDate.setHours(0,0,0,0);

                const recentlyChosenIds = history
                    .filter(h => new Date(h.selectedAt) >= cutoffDate)
                    .map(h => h.dishId);

                const available = dishes.filter(d => !recentlyChosenIds.includes(d.id));
                return available.length > 0 ? available : dishes;
            }, [dishes, history, antiRepeatDays]);

            const handleSpin = () => {
                if (dishes.length === 0) return;
                setIsSpinning(true);
                setCheckedIngredients({});

                const winner = eligibleDishes[Math.floor(Math.random() * eligibleDishes.length)];
                
                const totalRolls = 24;
                let step = 0;
                
                const runStep = () => {
                    setRouletteIndex(step % dishes.length);
                    playSound('tick');
                    
                    if (step < totalRolls - 1) {
                        step++;
                        const progress = step / totalRolls;
                        const delay = 45 + Math.pow(progress, 3) * 420; 
                        setTimeout(runStep, delay);
                    } else {
                        setIsSpinning(false);
                        setTodayChoice(winner);
                        playSound('win');
                        
                        const newHistoryEntry = {

                                <Icon name="shield" className="w-3 h-3 text-zinc-400" />
                                <span>Evita repetidos de hace {antiRepeatDays} día(s).</span>
                            </p>

                    </div>

                </div>
            );

        function PlatosTab({ dishes, setDishes, family, onEditDish, onNewDish, customConfirm, showToast }) {
            const [search, setSearch] = useState('');
            const [filterCategory, setFilterCategory] = useState('Todos');

            const filteredDishes = useMemo(() => {
                return dishes.filter(d => {
                    const matchesSearch = d.name.toLowerCase().includes(search.toLowerCase());
                    const matchesCat = filterCategory === 'Todos' || d.category === filterCategory;
                    return matchesSearch && matchesCat;
                });
            }, [dishes, search, filterCategory]);

            const categories = ['Todos', 'Tradicional', 'Favorito', 'Rápido', 'Entrada / Principal', 'Criollo'];

            const handleDelete = (id, name) => {
                customConfirm(
                    'Eliminar plato',
                    `¿Deseas eliminar "${name}" de la lista?`,
                    () => {
                        setDishes(prev => prev.filter(d => d.id !== id));
                        showToast('Plato eliminado');

            return (
                <div className="space-y-4 pb-8">

                        </div>
                        <button 
                            onClick={onNewDish}
                            className="bg-accent-600 hover:bg-accent-500 text-white font-semibold text-xs px-3.5 py-2 rounded-xl shadow-glow-accent transition-all flex items-center gap-1.5 active:scale-95"

                            <Icon name="plus" className="w-3.5 h-3.5" />
                            <span>Agregar</span>
                        </button>
                    </div>

                    {/* Search */}
                    <div className="relative">
                        <Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-zinc-500" />
                        <input 
                            type="text" 
                            placeholder="Buscar plato o ingrediente..." 
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            className="w-full bg-dark-850 border border-zinc-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent-500 transition-colors"
                        />
                    </div>

                    {/* Category Filter Pills */}
                    <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">

                                onClick={() => setFilterCategory(cat)}
                                className={`px-3 py-1 rounded-xl whitespace-nowrap font-medium text-[11px] transition-colors border ${
                                    filterCategory === cat 
                                    ? 'bg-zinc-100 text-zinc-950 border-zinc-100 font-bold'

                                {cat}
                            </button>

                    {/* Dishes List */}
                    <div className="space-y-2.5 pt-1">
                        {filteredDishes.length > 0 ? (
                            filteredDishes.map(dish => (
                                <div 
                                    key={dish.id} 
                                    className="p-3.5 bg-dark-850 rounded-2xl border border-zinc-800/80 hover:border-zinc-700/80 transition-all flex items-start justify-between gap-3 shadow-sm"
                                >
                                    <div className="space-y-1.5 flex-1">
                                        <div className="flex items-center gap-2">
                                            <h3 className="font-bold text-zinc-100 text-sm">{dish.name}</h3>
                                            {dish.favorite && (
                                                <Icon name="star" className="w-3.5 h-3.5 text-amber-400 fill-amber-400" />
                                            )}
                                        </div>

                                        {dish.category && (
                                            <span className="inline-block text-[9px] bg-zinc-800/90 text-zinc-400 px-2 py-0.5 rounded-md font-medium border border-zinc-700/40">
                                                {dish.category}
                                            </span>
                                        )}

                                        {/* Family Tags */}
                                        {dish.familyMembers && dish.familyMembers.length > 0 && (
                                            <div className="flex flex-wrap gap-1 pt-0.5">
                                                {dish.familyMembers.map(mId => {
                                                    const mem = family.find(f => f.id === mId);
                                                    if (!mem) return null;
                                                    return (
                                                        <span key={mId} className="text-[10px] bg-rose-950/40 text-rose-300 px-2 py-0.5 rounded-full font-medium border border-rose-800/30 flex items-center gap-1">
                                                            <Icon name="heart" className="w-2.5 h-2.5 text-rose-400" />
                                                            <span>{mem.name}</span>
                                                        </span>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        <p className="text-[11px] text-zinc-500 line-clamp-1">
                                            {dish.ingredients && dish.ingredients.length > 0

        function DishModal({ dish, family, onClose, onSave }) {
            const [name, setName] = useState(dish.name || '');
            const [category, setCategory] = useState(dish.category || 'Tradicional');
            const [favorite, setFavorite] = useState(dish.favorite || false);
            const [selectedMembers, setSelectedMembers] = useState(dish.familyMembers || []);
            const [ingredients, setIngredients] = useState(dish.ingredients || []);

            const [ingName, setIngName] = useState('');
            const [ingQty, setIngQty] = useState('');
            const [ingUnit, setIngUnit] = useState('');

            const toggleMember = (mId) => {
                setSelectedMembers(prev => 
                    prev.includes(mId) ? prev.filter(id => id !== mId) : [...prev, mId]
                );
            };

            const addIngredient = () => {
                if (!ingName.trim()) return;
                const newIng = {
                    id: 'i_' + Date.now() + Math.random(),
                    name: ingName.trim(),
                    quantity: ingQty.trim(),
                    unit: ingUnit.trim()
                };
                setIngredients(prev => [...prev, newIng]);
                setIngName('');
                setIngQty('');
                setIngUnit('');
            };

            const removeIngredient = (id) => {
                setIngredients(prev => prev.filter(i => i.id !== id));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim()) return;

                const savedDish = {
                    id: dish.id || 'd_' + Date.now(),
                    name: name.trim(),
                    category,
                    favorite,
                    familyMembers: selectedMembers,
                    ingredients
                };
                onSave(savedDish);

                <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">

                                <Icon name="x" className="w-4 h-4" />

                            <div>

                                    required
                                    placeholder="Ej: Ají de Gallina"

                                    <label className="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-1">
                                        Categoría

                                    <select 
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="w-full bg-dark-850 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-accent-500"
                                    >
                                        <option value="Tradicional">Tradicional</option>
                                        <option value="Favorito">Favorito</option>
                                        <option value="Rápido">Rápido</option>
                                        <option value="Entrada / Principal">Entrada / Principal</option>
                                        <option value="Criollo">Criollo</option>
                                    </select>
                                </div>

                                <div className="flex flex-col justify-end">
                                    <button
                                        type="button"
                                        onClick={() => setFavorite(!favorite)}
                                        className={`w-full py-2 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors ${
                                            favorite 
                                            ? 'bg-amber-950/40 border-amber-500/40 text-amber-300' 
                                            : 'bg-dark-850 border-zinc-800 text-zinc-400'
                                        }`}
                                    >
                                        <Icon name="star" className={`w-3.5 h-3.5 ${favorite ? 'fill-amber-400 text-amber-400' : ''}`} />
                                        <span>{favorite ? 'Favorito' : 'Marcar favorito'}</span>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label className="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-1.5">
                                    ¿A quién le gusta?
                                </label>
                                <div className="flex flex-wrap gap-1.5">
                                    {family.map(mem => {

                                        return (

                                                    isSelected

                                            >
                                                <Icon name={mem.icon || 'user'} className="w-3 h-3" />
                                                <span>{mem.name}</span>
                                                {isSelected && <Icon name="check" className="w-3 h-3 text-rose-400" />}

                                        );
                                    })}

                            <div className="border-t border-zinc-800/80 pt-3">

                                    <input

                                    <input

                                    <button

                                >
                                    Guardar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            );
        }

        function HistorialTab({ history, dishes, setHistory, customConfirm }) {

            const clearHistory = () => {
                customConfirm(
                    'Vaciar historial',
                    '¿Deseas borrar las elecciones registradas?',
                    () => setHistory([])
                );
            };

            return (
                <div className="space-y-4 pb-8">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="text-lg font-extrabold text-zinc-100 tracking-tight">Historial</h2>
                            <p className="text-xs text-zinc-400">Platos seleccionados en días anteriores</p>
                        </div>

                        {history.length > 0 && (
                            <button 
                                onClick={clearHistory}
                                className="text-xs text-rose-400 font-semibold hover:underline flex items-center gap-1"
                            >
                                <Icon name="trash" className="w-3 h-3" />
                                <span>Borrar</span>
                            </button>
                        )}
                    </div>

                    {history.length > 0 ? (
                        <div className="space-y-2">
                            {history.map((item, idx) => {
                                const dateObj = new Date(item.selectedAt);
                                const dateFormatted = dateObj.toLocaleDateString('es-ES', { 
                                    weekday: 'short', 
                                    day: 'numeric', 
                                    month: 'short' 
                                });
                                const timeFormatted = dateObj.toLocaleTimeString('es-ES', { 
                                    hour: '2-digit', 
                                    minute: '2-digit' 
                                });

                                return (
                                    <div 
                                        key={item.id || idx} 
                                        className="p-3 bg-dark-850 rounded-2xl border border-zinc-800/80 flex items-center justify-between"
                                    >
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 rounded-xl bg-accent-950/60 border border-accent-600/30 text-accent-400 flex items-center justify-center font-bold">
                                                <Icon name="utensils" className="w-4 h-4" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-zinc-100 text-xs">{item.dishName}</h4>
                                                <p className="text-[10px] text-zinc-500 capitalize">
                                                    {dateFormatted} • {timeFormatted}
                                                </p>
                                            </div>
                                        </div>

                                        <span className="text-[10px] text-zinc-400 font-medium bg-zinc-800 px-2.5 py-0.5 rounded-full border border-zinc-700/50">
                                            Elegido
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="text-center py-12 text-zinc-500 text-xs flex flex-col items-center">
                            <Icon name="calendar" className="w-8 h-8 text-zinc-600 mb-2" />
                            Aún no hay platos en el historial.
                        </div>
                    )}
                </div>
            );
        }

        function ConfigTab({ family, setFamily, antiRepeatDays, setAntiRepeatDays, setDishes, setHistory, setTodayChoice, customConfirm, showToast }) {
            const [newMemName, setNewMemName] = useState('');
            const [newMemRole, setNewMemRole] = useState('Hermano');
            const [newMemIcon, setNewMemIcon] = useState('user');

            const addFamilyMember = (e) => {
                e.preventDefault();
                if (!newMemName.trim()) return;

                const newMember = {
                    id: 'm_' + Date.now(),
                    name: newMemName.trim(),
                    role: newMemRole,
                    icon: newMemIcon,
                    color: 'text-zinc-300 border-zinc-700 bg-zinc-800'
                };

                setFamily(prev => [...prev, newMember]);
                setNewMemName('');
                showToast('Integrante agregado');
            };

            const removeMember = (id, name) => {
                customConfirm(
                    'Eliminar integrante',
                    `¿Quitar a ${name} de la lista de la familia?`,
                    () => {
                        setFamily(prev => prev.filter(m => m.id !== id));
                        showToast('Integrante eliminado');
                    }
                );
            };

            const resetDemoData = () => {
                customConfirm(
                    'Restablecer datos',
                    'Se restaurarán los platos peruanos iniciales de ejemplo y los integrantes por defecto.',
                    () => {
                        setDishes(INITIAL_DISHES);
                        setFamily(INITIAL_FAMILY);
                        setHistory([]);
                        setTodayChoice(null);
                        showToast('Datos de ejemplo restaurados');
                    }
                );
            };

            return (
                <div className="space-y-5 pb-8">
                    <div>
                        <h2 className="text-lg font-extrabold text-zinc-100 tracking-tight">Configuración</h2>
                        <p className="text-xs text-zinc-400">Integrantes de familia y reglas del sorteo</p>
                    </div>

                    {/* Anti-repeat section */}
                    <div className="bg-dark-850 p-4 rounded-3xl border border-zinc-800 space-y-3">
                        <h3 className="font-bold text-xs text-zinc-200 flex items-center gap-1.5">
                            <Icon name="shield" className="w-4 h-4 text-accent-400" />
                            <span>Prevención de repetición</span>
                        </h3>
                        <p className="text-[11px] text-zinc-400">
                            Evita que los platos recientemente seleccionados vuelvan a salir en la ruleta.
                        </p>

                        <div className="pt-1">
                            <select 
                                value={antiRepeatDays}
                                onChange={(e) => setAntiRepeatDays(parseInt(e.target.value))}
                                className="w-full bg-dark-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-xs font-medium text-zinc-200 focus:outline-none focus:border-accent-500"
                            >
                                <option value={0}>Permitir repetir sin restricción</option>
                                <option value={1}>No repetir por 1 día</option>
                                <option value={3}>No repetir por 3 días (Recomendado)</option>
                                <option value={7}>No repetir por 7 días</option>
                            </select>
                        </div>
                    </div>

                    {/* Family members section */}
                    <div className="bg-dark-850 p-4 rounded-3xl border border-zinc-800 space-y-3">
                        <h3 className="font-bold text-xs text-zinc-200 flex items-center gap-1.5">
                            <Icon name="users" className="w-4 h-4 text-accent-400" />
                            <span>Integrantes de la Familia</span>
                        </h3>

                        <div className="space-y-1.5">
                            {family.map(member => (
                                <div key={member.id} className="flex items-center justify-between p-2.5 bg-dark-900 rounded-2xl border border-zinc-800/80">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-7 h-7 rounded-lg bg-zinc-800 text-zinc-300 flex items-center justify-center">
                                            <Icon name={member.icon || 'user'} className="w-3.5 h-3.5" />
                                        </div>
                                        <div>
                                            <div className="font-bold text-xs text-zinc-200">{member.name}</div>
                                            <div className="text-[9px] text-zinc-500">{member.role}</div>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => removeMember(member.id, member.name)}
                                        className="text-zinc-500 hover:text-rose-400 p-1"
                                    >
                                        <Icon name="x" className="w-3.5 h-3.5" />
                                    </button>
                                </div>
                            ))}
                        </div>

                        <form onSubmit={addFamilyMember} className="pt-2 border-t border-zinc-800/80 space-y-2">
                            <span className="text-[10px] font-bold text-zinc-400 block uppercase tracking-wider">Agregar integrante</span>
                            <div className="flex gap-1.5">
                                <select 
                                    value={newMemIcon}
                                    onChange={(e) => setNewMemIcon(e.target.value)}
                                    className="bg-dark-900 border border-zinc-800 rounded-xl px-2 text-xs text-zinc-300 outline-none"
                                >
                                    <option value="user-woman">👩</option>
                                    <option value="user-man">👨</option>
                                    <option value="user-boy">👦</option>
                                    <option value="user-girl">👧</option>
                                    <option value="user">👤</option>
                                </select>
                                <input 
                                    type="text" 
                                    placeholder="Nombre"
                                    value={newMemName}
                                    onChange={(e) => setNewMemName(e.target.value)}
                                    className="flex-1 bg-dark-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-accent-500"
                                />
                                <button 
                                    type="submit"
                                    className="bg-zinc-800 text-zinc-200 font-bold text-xs px-3 py-1.5 rounded-xl hover:bg-zinc-700"
                                >
                                    Añadir
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Reset button */}
                    <div className="pt-1">
                        <button 
                            onClick={resetDemoData}
                            className="w-full py-2.5 px-4 bg-dark-850 text-zinc-400 hover:text-zinc-200 font-medium text-xs rounded-2xl border border-zinc-800 transition-colors flex items-center justify-center gap-2"
                        >
                            <Icon name="refresh" className="w-3.5 h-3.5" />
                            <span>Restablecer platos peruanos de ejemplo</span>
                        </button>
                    </div>

                </div>
            );
        }

        function Icon({ name, className = "w-5 h-5" }) {
            switch(name) {
                case 'home':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                    );
                case 'utensils':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    );
                case 'calendar':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    );
                case 'settings':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    );
                case 'dice':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <rect x="3" y="3" width="18" height="18" rx="4" strokeLinecap="round" strokeLinejoin="round" />
                            <circle cx="8.5" cy="8.5" r="1.25" fill="currentColor" />
                            <circle cx="15.5" cy="8.5" r="1.25" fill="currentColor" />
                            <circle cx="12" cy="12" r="1.25" fill="currentColor" />
                            <circle cx="8.5" cy="15.5" r="1.25" fill="currentColor" />
                            <circle cx="15.5" cy="15.5" r="1.25" fill="currentColor" />
                        </svg>
                    );
                case 'sparkles':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                        </svg>
                    );
                case 'play':
                    return (
                        <svg className={className} viewBox="0 0 24 24" stroke="none">
                            <path d="M8 5v14l11-7z" fill="currentColor" />
                        </svg>
                    );
                case 'heart':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                    );
                case 'star':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                        </svg>
                    );
                case 'list-checks':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    );
                case 'check':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    );
                case 'plus':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    );
                case 'search':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    );
                case 'pencil':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                    );
                case 'trash':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    );
                case 'shield':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    );
                case 'users':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    );
                case 'user':
                case 'user-man':
                case 'user-woman':
                case 'user-boy':
                case 'user-girl':
                case 'user-check':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    );
                case 'refresh':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    );
                case 'x':
                    return (
                        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    );
                default:
                    return null;
            }
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

    </script>
</body>
</html>
